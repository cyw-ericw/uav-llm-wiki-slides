<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>簡報瀏覽器驗收</title>
<style>body{font:16px system-ui;color:#183c34}button{padding:8px}pre{white-space:pre-wrap;word-break:break-word}iframe{border:0;display:block}.viewport{max-height:650px;overflow:auto;max-width:100%}</style>
<h1>簡報瀏覽器驗收</h1><p>從專案根目錄執行 python3 -m http.server 後開啟 checks/browser-test.html。所有量測在同源簡報內執行，單位為 CSS 像素。</p>
<button id="run">執行全頁檢查</button> <button id="phone">查看 390 像素畫面</button>
<pre id="log" aria-live="polite">等待執行</pre><div class="viewport"><iframe title="待測投影片" width="1024" height="768" src="../slides/deck.html"></iframe></div>
<script>
const frame=document.querySelector('iframe'), log=document.querySelector('#log');
const sizes=[[1440,900],[1024,768],[768,1024],[390,844],[320,568]];
const pause=()=>new Promise(r=>setTimeout(r,24));
const phone=document.querySelector('#phone'),run=document.querySelector('#run');
phone.onclick=()=>{frame.width=390;frame.height=844;frame.contentWindow.location.hash='p09'};
run.onclick=async()=>{
 run.disabled=phone.disabled=true;
 log.textContent='測試中'; const lines=[],errors=[];
 const assert=(x,msg)=>{if(!x)errors.push(msg)};
 try{
  const doc=frame.contentDocument,w=frame.contentWindow;
  const one=(q)=>doc.querySelector(q);
  const slides=[...doc.querySelectorAll('.frame')];
  let pageChecks=0,openChecks=0,transitions=0;
  const at=async(i,label)=>{
   await pause();transitions++;
   assert(slides.filter(s=>!s.hidden).length===1&&!slides[i].hidden,label+' active');
   assert(one('select').selectedIndex===i,label+' select');
   assert(one('.counter').textContent.startsWith(String(i+1).padStart(2,'0')),label+' counter');
  };
  for(const [width,height] of sizes){
   frame.width=width;frame.height=height;w.location.hash=slides[0].id;await at(0,'start');
   const before=errors.length,base=[],expanded=[];
   for(let i=0;i<slides.length;i++){
    const p=slides[i],label=width+'/'+p.id;
    if(i){one('#next').click();await at(i,label)}
    assert(i!==0||one('#prev').disabled,label+' first boundary');
    assert(i!==10||one('#next').disabled,label+' last boundary');
    for(const opened of [false,true]){
     for(const details of p.querySelectorAll('details')){
      if(details.open!==opened)details.querySelector('summary').click();
      assert(details.open===opened,label+' disclosure');
     }
     await pause();
     const root=doc.documentElement;
     const dims=[root.clientWidth,root.scrollWidth,root.scrollHeight];
     (opened?expanded:base).push(dims);
     assert(root.scrollWidth<=root.clientWidth,label+' horizontal '+dims);
     if(!opened&&width>=1024)assert(root.scrollHeight<=height+1,label+' closed height '+dims);
     for(const e of doc.querySelectorAll('main *,aside a')){
      if(!e.checkVisibility())continue;
      const r=e.getBoundingClientRect(),style=w.getComputedStyle(e);
      if(!r.width||!r.height)continue;
      assert(r.left>=-1&&r.right<=root.clientWidth+1,label+' outside '+e.tagName);
      if(e.clientWidth && style.display!=='inline' && e.tagName!=='SELECT')
       assert(e.scrollWidth<=e.clientWidth+1,label+' clipped '+e.tagName);
      if(['hidden','clip'].includes(style.overflowY))
       assert(e.scrollHeight<=e.clientHeight+1,label+' vertical '+e.tagName);
     }
     if(opened)openChecks++;else pageChecks++;
    }
    for(const d of p.querySelectorAll('details'))d.querySelector('summary').click();
   }
   for(let i=9;i>=0;i--){one('#prev').click();await at(i,width+'/prev')}
   for(const [key,target] of [['End',10],['Home',0],['ArrowRight',1],['ArrowLeft',0]]){
    doc.activeElement.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true}));await at(target,width+'/'+key)
   }
   for(let i=10;i>=0;i--){
    if(width>900){doc.querySelectorAll('.contents a')[i].click()}
    else{one('select').selectedIndex=i;one('select').dispatchEvent(new w.Event('change',{bubbles:true}))}
    await at(i,width+'/index')
   }
   const maxH=arr=>Math.max(...arr.map(a=>a[2]));
   const excess=arr=>Math.max(...arr.map(a=>a[1]-a[0]));
   lines.push(width+'×'+height+' '+(errors.length===before?'PASS':'FAIL')+' | pages '+base.length+' | max height closed/open '+maxH(base)+'/'+maxH(expanded)+' | max x overflow closed/open '+excess(base)+'/'+excess(expanded));
   log.textContent=lines.join('\n');
  }
  lines.push('closed='+pageChecks+' expanded='+openChecks+' navigation observations='+transitions+' errors='+errors.length);
 }catch(e){errors.push(String(e))}
 lines.push(...errors);
 log.textContent=(errors.length?'FAIL':'PASS')+'\n'+lines.join('\n');
 run.disabled=phone.disabled=false;
};
</script></html>
