<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="board-title board-desc" viewBox="0 0 550 285">
<title id="board-title">Pixhawk 6C 板載功能邏輯分層</title>
<desc id="board-desc">圖中將運算與感測畫成兩個概念層。綠色方塊代表處理器，藍灰色方塊代表板載感測器。位置與層數均為教學示意。</desc>
<defs>
 <linearGradient id="board-face" x2="1" y2="1"><stop stop-color="#58716c"/><stop offset=".48" stop-color="#394e4c"/><stop offset="1" stop-color="#233b39"/></linearGradient>
 <linearGradient id="chip-face" x2="1" y2="1"><stop stop-color="#cee89d"/><stop offset=".52" stop-color="#90b363"/><stop offset="1" stop-color="#6e944a"/></linearGradient>
 <pattern id="plane-grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#8aafa3" fill="none" opacity=".18"/></pattern>
 <g id="base-board">
  <path d="M-105 -55H93L105 -43V47L94 58H-95L-105 46Z" fill="url(#board-face)" stroke="#a1b8a8" stroke-width="1.5"/>
  <g fill="none" stroke="#89a98e" stroke-width="1.2"><path d="M-94 -32h31l12 13h44m-81-6h24l13 13h30m-13 43h19l13-12h33l12 12h30m-151 7h34l12-12h16m47-61h27l8 8h20m-38-2h8l11 11h19"/></g>
  <g fill="#132b2e" stroke="#c3b584" stroke-width="2.5"><circle cx="-90" cy="-40" r="4"/><circle cx="87" cy="-34" r="4"/><circle cx="85" cy="43" r="4"/><circle cx="-84" cy="41" r="4"/></g>
 </g>
